name: syntax-checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Parse Bash and PBS scripts
        run: |
          find . -type f \( -name '*.sh' -o -name '*.pbs' \) -print0 \
            | xargs -0 -n1 bash -n
      - name: Smoke-test scheduler-free dispatch and original row selection
        run: bash tests/smoke_test_local_runner.sh
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and exercise CLI outside checkout
        run: python tests/check_installed_wheel.py dist/*.whl
      - name: Rebuild wheel from source distribution
        run: python -m pip wheel --no-deps dist/*.tar.gz -w rebuilt
